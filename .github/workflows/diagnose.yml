name: Diagnose VOX access

on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests curl_cffi
      - name: Probe
        shell: python
        run: |
          import re, requests
          from curl_cffi import requests as cffi
          B = "https://egy.voxcinemas.com"
          urls = [
              f"{B}/showtimes?c=city-centre-alexandria&m=avengers-doomsday&d=20261229",
              f"{B}/showtimes?c=city-centre-alexandria&m=avengers-doomsday",
              f"{B}/showtimes?c=city-centre-alexandria",
              f"{B}/movies/avengers-doomsday",
              f"{B}/movies/comingsoon",
              f"{B}/movies/whatson",
          ]
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"}
          def show(html):
              slugs = sorted(set(re.findall(r'/movies/([a-z0-9-]*(?:avengers|doomsday)[a-z0-9-]*)', html)))
              print("   avengers/doomsday slugs:", slugs)
              print("   booking links:", len(re.findall(r'/booking/\d{4}-\d+', html)), sorted(set(re.findall(r'/booking/\d{4}-\d+', html)))[:5])
              print("   'infinity' count:", html.lower().count("infinity"), "| experiences:", sorted(set(re.findall(r'(?i)\b(imax|4dx|max|gold|screenx|infinity vision|kids|theatre|standard|2d|3d)\b', html)))[:20])
              print("   dates:", sorted(set(re.findall(r'd=(2026\d{4})', html)))[:40])
              for kw in ("doomsday", "infinity"):
                  for m in list(re.finditer(kw, html, re.I))[:3]:
                      print(f"   --- {kw} @ {m.start()}:", re.sub(r"\s+", " ", html[max(0, m.start()-700):m.start()+900]))
          for url in urls:
              print("=" * 100, "\n", url)
              for name, get in [("requests", lambda u: requests.get(u, headers=UA, timeout=30)),
                                ("curl_cffi", lambda u: cffi.get(u, impersonate="chrome", timeout=45))]:
                  try:
                      r = get(url)
                      print(f" {name}: HTTP {r.status_code}, {len(r.text)} bytes, final {r.url}, server={r.headers.get('server')}")
                      if name == "curl_cffi" or r.status_code == 200:
                          if r.status_code == 200: show(r.text)
                          else: print("   body:", re.sub(r"\s+", " ", r.text[:400]))
                  except Exception as e:
                      print(f" {name}: ERROR {e!r}")
