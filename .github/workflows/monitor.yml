name: VOX ticket monitor

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub's fastest schedule; runs may start a few minutes late
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Send a test alert instead of checking VOX"
        type: boolean
        default: false

concurrency:
  group: vox-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: vox-state-${{ github.run_id }}
          restore-keys: vox-state-
      - name: Check VOX
        run: python monitor.py ${{ inputs.test_notify && '--test-notify' || '--once' }}
        env:
          TARGET_DATE: ${{ vars.TARGET_DATE }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_EMAIL: ${{ secrets.NTFY_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          TWILIO_TO: ${{ secrets.TWILIO_TO }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
      - name: Save state
        if: always() && !inputs.test_notify
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: vox-state-${{ github.run_id }}
